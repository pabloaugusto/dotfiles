version = 1

[context]
kind = "dev"

[paths]
config_root = "config"
runtime_root = "app"
agents_root = ".agents"

[integration_sources]
platforms = "config/platforms.yaml"
jira_model = "config/jira-model.yaml"
confluence_model = "config/confluence-model.yaml"
sync_targets = "config/sync-targets.yaml"

[policy]
root_regionalization = "config/config.toml::regionalization"
python_toolchain_root = "pyproject.toml"
