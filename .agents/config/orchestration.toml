mandatory_rules = ["no-transition-without-structured-comment", "every-agent-touch-on-tracked-issue-must-log-in-jira", "every-acting-role-must-comment-when-work-starts", "every-acting-role-must-comment-on-meaningful-progress-while-working", "every-acting-role-must-comment-before-handoff-or-pause", "every-relevant-operation-must-have-explicit-owner-agent", "if-no-agent-fits-the-operation-create-or-formalize-one-through-backlog", "jira-status-must-reflect-real-time-state-of-work", "jira-status-and-agent-comments-must-stay-in-parity", "every-acting-role-must-update-current-and-next-role", "every-acting-role-must-attach-evidence-or-explicit-na", "repo-artifact-references-must-use-github-links", "every-commit-must-map-to-a-single-jira-scope", "every-branch-must-map-to-a-single-jira-scope", "every-pr-must-map-to-a-single-jira-scope", "versioned-prompt-pack-work-must-declare-task-id-as-prompt-slug", "versioned-prompt-pack-work-must-use-prompt-branch-type", "versioned-prompt-pack-work-must-use-prompt-scope-in-commit-and-pr-title", "versioned-prompt-pack-owner-issues-must-use-prompt-summary-prefix", "versioned-prompt-pack-owner-issues-must-carry-prompt-label", "every-new-issue-must-run-deduplication-preflight-against-open-work", "every-non-epic-demand-must-check-for-an-open-matching-epic-before-creation", "every-new-epic-must-prove-that-no-open-epic-already-covers-the-theme", "epic-or-issue-creation-bypass-must-be-justified-in-a-jira-comment", "tags-and-releases-must-stay-jira-traceable", "jira-key-in-git-metadata-must-belong-to-real-work-performed", "doing-must-reflect-active-execution-only", "interrupted-work-must-move-to-paused-with-reason", "every-active-local-operation-must-write-active-execution-context", "handoff-pause-and-done-must-clear-active-execution-context", "documentation-changes-must-be-mentioned-in-related-issue", "comments-without-proof-do-not-count-as-complete-work", "consultive-reviewers-must-log-findings-in-jira-when-scope-is-tracked", "blockers-that-no-agent-can-unblock-must-escalate-to-the-user", "blocker-escalation-must-use-all-available-channels", "blocker-escalation-attempts-must-be-logged-in-jira-and-confluence", "branch-closure-must-trigger-required-ceremony-chain", "required-ceremony-chain-must-produce-log-ledger-confluence-and-jira-when-applicable", "unresolved-ceremony-findings-must-open-or-link-governance-bug", "every-meaningful-agent-milestone-must-also-be-summarized-in-chat", "acting-agent-must-own-the-chat-message-for-the-work-it-is-executing", "zero-context-startup-must-load-chat-contract-before-first-user-message", "first-operational-chat-message-belongs-to-ai-startup-governor-until-ready-for-work", "chat-summaries-must-stay-human-short-and-non-robotic", "chat-summaries-must-start-with-bracketed-dd-mm-hh-mm-timestamp-and-bold-agent-name-prefix", "chat-summary-timestamp-must-use-real-local-system-clock-at-send-time", "chat-summary-body-must-start-on-the-line-after-the-prefix", "repo-references-in-chat-must-use-ide-openable-links", "repo-file-chat-links-must-use-absolute-path-markdown-targets", "repo-file-chat-links-must-not-use-vscode-resource-or-custom-uri", "jira-and-confluence-work-items-in-chat-must-use-canonical-web-links", "chat-summaries-do-not-replace-jira-or-confluence-traceability", "jira-current-and-next-role-fields-must-use-alias-first-visible-values", "jira-assignee-must-sync-to-the-acting-agent-when-an-explicit-principal-mapping-exists", "no-subagent-delegation-before-startup-context-is-loaded-or-linked", "startup-governor-must-materialize-startup-ready-artifact-before-handoff", "startup-governor-must-block-operational-output-when-clearance-is-not-ready", "subagent-handoff-must-carry-owner-issue-startup-context-and-applicable-rules", "subagent-handoff-must-carry-pea-classification-when-applicable", "ambiguous-or-structural-work-must-run-pre-execution-alignment-before-execution", "work-executed-without-required-startup-context-is-rejectable", "closed-issues-must-trigger-commit-checkpoint-evaluation", "commit-must-happen-immediately-after-issue-close-when-scope-is-already-valid", "deferred-commit-after-issue-close-must-be-justified-by-parent-scope"]
