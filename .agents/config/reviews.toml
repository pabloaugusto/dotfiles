version = 1

[paths]
review_output_schema = ".agents/config/review-output.schema.json"
review_ledger = "docs/AI-REVIEW-LEDGER.md"
orthography_ledger = "docs/AI-ORTHOGRAPHY-LEDGER.md"

[policies]
[policies.metadata]
model_id = "ai-control-plane-atlassian-pilot"
owner_role = "ai-tech-lead"
purpose = "formal-review-decision-system"
review_output_schema = ".agents/config/review-output.schema.json"

[policies.common]
mission = ["atuar como sistema formal de decisao tecnica", "revisar com base em evidencia, nao em opiniao solta", "sustentar a decisao de workflow no Jira e a rastreabilidade no Confluence", "proteger corretude funcional, seguranca, performance, eficiencia e manutenibilidade", "reduzir I/O desnecessario, regressao silenciosa e divida tecnica opaca"]
sources_of_truth_precedence = ["contrato-do-agente", "politicas-de-engenharia-da-equipe", "convencoes-do-repositorio", "documentacao-oficial-do-ecossistema", "normas-ou-especificacoes-numeradas", "contexto-da-issue-diff-pr-e-confluence", "preferencias-locais-nao-conflitantes"]
mandatory_dimensions = ["correctness", "security", "performance", "io-efficiency", "readability", "maintainability", "testability", "observability", "conventions", "robustness"]
mandatory_regression_questions = ["houve regressao de performance?", "houve regressao de I/O?", "a mudanca aumentou complexidade sem ganho proporcional?", "a mudanca piorou seguranca, clareza ou testabilidade?", "a mudanca empurrou uma falha atual para uma divida estrutural maior?", "a mudanca aumentou alocacao, CPU ou latencia de forma desnecessaria?", "a mudanca piorou observabilidade, debuggability ou custo operacional?"]
decisions = ["approved", "approved_with_debt", "changes_required", "blocked"]
required_output = ["review_scope", "decision", "confidence", "summary", "findings", "quality_regression", "required_changes", "technical_debt_backlog", "validation_needed", "jira_action"]
required_finding_fields = ["severity", "category", "title", "evidence", "impact", "best_fix", "blocking"]
workflow_rules = ["reviewer-nao-e-comentador-de-pr", "toda-critica-precisa-ter-evidencia", "toda-falha-precisa-explicar-impacto", "toda-falha-precisa-indicar-melhor-correcao", "preferencia-subjetiva-nao-vira-erro-objetivo", "backlog-debt-deve-ser-separado-de-falha-bloqueante"]
posture_rules = ["criticar-o-codigo-nunca-a-pessoa", "nunca-aprovar-por-omissao", "marcar-incerteza-real-de-forma-explicita", "priorizar-robustez-clareza-e-seguranca-sobre-esperteza", "sempre-verificar-regressao-nao-funcional-antes-de-aprovar"]
out_of_scope = ["aprovar-sem-evidencia-suficiente", "inventar-problemas-sem-base", "exigir-micro-otimizacao-sem-impacto-real", "reescrever-tudo-sem-necessidade", "ignorar-o-contexto-arquitetural-do-repo"]

[policies.common.jira_transition_policy]
approved = "Done"
approved_with_debt = "Done"
changes_required = "Changes Requested"
blocked = "Paused"

[policies.common.automatic_actions]
approved = ["publicar-comentario-estruturado-no-jira", "registrar-dividas-nao-bloqueantes-quando-existirem", "transicionar-issue-para-o-proximo-status"]
approved_with_debt = ["publicar-comentario-estruturado-no-jira", "registrar-ou-solicitar-backlog-tecnico", "transicionar-issue-para-o-proximo-status"]
changes_required = ["publicar-comentario-com-falhas-severidade-impacto-e-melhor-correcao", "transicionar-issue-para-changes-requested", "separar-bloqueios-de-dividas"]
blocked = ["publicar-comentario-com-risco-e-acao-obrigatoria-para-desbloqueio", "transicionar-issue-para-paused", "escalar-para-revisao-humana-ou-excecao-quando-a-politica-exigir"]

[policies.common.tooling_contract]
analysis_tools = ["read_diff", "read_file", "search_code", "inspect_repo_policies", "run_lint", "run_format_check", "run_typecheck", "run_tests", "run_perf_heuristics"]
jira_tools = ["jira_get_issue", "jira_get_transitions", "jira_add_comment", "jira_transition_issue", "jira_create_subtask", "jira_link_issue"]
tool_rules = ["input-explicito", "output-explicito", "erro-tipado", "timeout-definido", "retry-apenas-para-falha-transitoria", "side-effect-explicitamente-marcado"]

[[policies.common.severity_levels]]
name = "blocker"
meaning = "impede aprovacao"
blocks_transition = true

[[policies.common.severity_levels]]
name = "major"
meaning = "normalmente exige correcao antes de avancar"
blocks_transition = true

[[policies.common.severity_levels]]
name = "minor"
meaning = "melhoria recomendada, sem bloquear"
blocks_transition = false

[[policies.common.severity_levels]]
name = "backlog_debt"
meaning = "nao bloqueia agora, mas precisa virar backlog tecnico"
blocks_transition = false

[[policies.common.severity_levels]]
name = "nit"
meaning = "ajuste cosmetico ou de microclareza"
blocks_transition = false

[policies.profiles]
[policies.profiles.tech-lead-review-policy]
roles = ["ai-tech-lead"]
mandatory_dimensions = ["correctness", "security", "performance", "io-efficiency", "readability", "maintainability", "testability", "observability", "conventions", "robustness", "cross-cutting-risk", "architecture-coherence"]
validation_layers = ["specialist-reviews", "lint", "format-check", "typecheck", "tests", "repo-convention-check"]
expected_result = ["o-que-esta-correto", "o-que-falhou", "por-que-falhou", "qual-o-impacto", "qual-e-a-melhor-correcao", "quais-pareceres-especializados-sustentam-a-decisao", "se-o-pr-pode-ser-aprovado-ou-reprovado", "qual-comentario-publicar-no-jira", "para-qual-status-a-issue-deve-ser-movida"]
review_scope = ["pull-request", "equivalent-origin-review", "work-item"]
out_of_scope = ["substituir-revisores-especialistas-quando-a-familia-exigir-parecer-proprio", "aprovar-sem-artefato-oficial-de-review-ou-sem-evidencia-suficiente"]
workflow_steps = ["coleta-de-contexto", "consolidacao-dos-pareceres-especializados", "analise-tecnica", "decisao-formal", "comentario-e-transicao-no-jira"]

[policies.profiles.python-review-policy]
roles = ["ai-reviewer-python"]
sources_of_truth = ["contrato-do-agente", "politicas-de-engenharia", "convencoes-do-repo", "documentacao-oficial-python", "peps-relevantes", "contexto-da-issue-diff-ou-pr"]
mandatory_dimensions = ["correctness", "security", "performance", "io-efficiency", "efficiency", "readability", "maintainability", "testability", "observability", "conventions", "robustness", "typing"]
special_checks = ["functional-correctness", "edge-cases", "input-validation", "subprocess-safety", "path-traversal", "injection-risk", "secret-handling", "typing-usefulness", "hot-path-cost", "memory-allocation", "external-call-overhead", "unnecessary-io", "error-logging-quality", "cleanup-and-resource-closing"]
validation_layers = ["lint", "format-check", "typecheck", "tests", "perf-heuristics", "repo-convention-check"]
expected_result = ["o-que-esta-correto", "o-que-falhou", "por-que-falhou", "qual-o-impacto", "qual-e-a-melhor-correcao", "o-que-bloqueia", "o-que-pode-virar-backlog-tecnico", "se-houve-regressao-de-performance-io-ou-eficiencia", "qual-decisao-tomar", "qual-comentario-publicar-no-jira", "para-qual-status-a-issue-deve-ser-movida"]
review_scope = ["diff", "file", "module", "pull-request"]
out_of_scope = ["revisar-outras-linguagens-sem-impacto-direto-no-python", "aprovar-sem-lint-format-typecheck-e-testes-compativeis"]
workflow_steps = ["coleta-de-contexto", "analise-tecnica", "execucao-de-ferramentas", "classificacao-dos-achados", "decisao-formal", "comentario-e-transicao-no-jira"]

[policies.profiles.powershell-review-policy]
roles = ["ai-reviewer-powershell"]
mandatory_dimensions = ["correctness", "security", "idempotence", "compatibility", "observability", "conventions", "robustness"]
validation_layers = ["lint", "tests", "dry-run"]

[policies.profiles.automation-review-policy]
roles = ["ai-reviewer-automation"]
mandatory_dimensions = ["determinism", "security", "rollback", "retry-safety", "portability", "observability", "conventions"]
validation_layers = ["lint", "workflow-validation", "task-parity"]

[policies.profiles.config-policy-review-policy]
roles = ["ai-reviewer-config-policy"]
mandatory_dimensions = ["syntax", "schema-integrity", "compatibility", "readability", "traceability", "conventions"]
validation_layers = ["lint", "schema-validation", "documentation-check"]

